spring.application.name=bkk-backend

# Local Postgres connection (the least-privilege app role we created, not the superuser).
# Password is read from the DB_PASSWORD env var, falling back to the local dev value so
# nothing breaks if it's unset — this keeps real credentials out of git even though this
# particular one is just a localhost-only dev password.
spring.datasource.url=jdbc:postgresql://localhost:5432/bkk_transit
spring.datasource.username=bkk_app
spring.datasource.password=${DB_PASSWORD:bkk_dev_pw}

# Lets Hibernate (the JPA implementation Spring Boot pulls in) create/update tables
# from our @Entity classes automatically. Handy for local dev; a real project would
# switch this to "validate" and manage schema changes with Flyway/Liquibase instead
# once the schema stabilizes.
spring.jpa.hibernate.ddl-auto=update

# Logs the actual SQL Hibernate generates — turn this on while learning so you can see
# what your annotations/queries translate to, not just trust it blindly.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Where the (locally downloaded) GTFS static feed's stops.txt lives, relative
# to wherever `mvn spring-boot:run` is launched from (the project root).
bkk.gtfs.stops-file=gtfs-data/raw/stops.txt
bkk.gtfs.routes-file=gtfs-data/raw/routes.txt

# BKK FUTAR real-time API key (opendata.bkk.hu). No fallback value here on
# purpose, unlike the DB password above — this is a real, personally-issued
# secret with actual external API access, not a disposable local default.
# Set it as an env var (BKK_API_KEY) on your machine; the app won't start
# without one being present.
bkk.futar.api-key=${BKK_API_KEY}

# Local RabbitMQ connection (see docker container "bkk-rabbitmq"). These
# match Spring Boot's own defaults (localhost:5672, guest/guest) - listed
# explicitly here so the connection is documented rather than implicit.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Names for the ingestion pipeline's AMQP topology (see config/RabbitConfig.java).
# Kept as properties rather than hardcoded strings so producer/consumer/config
# all reference the same source of truth.
bkk.rabbitmq.exchange=bkk.vehicle-positions.exchange
bkk.rabbitmq.queue=vehicle-positions
bkk.rabbitmq.routing-key=vehicle-positions

# How often the background ingestion job polls BKK for vehicle positions and
# publishes them to the exchange. Separate from the frontend's own 10s poll
# of GET /api/vehicles - that endpoint's cache means bumping this doesn't
# proportionally increase load on BKK's API.
#
# 15s checked empirically against BKK's own reporting cadence, not guessed:
# queried vehicle_position_snapshots after ~48 min of collection and measured
# the actual gap between distinct lastUpdateTime values per vehicle - median
# 16s, average 19.1s (long-tailed by vehicles going out of service). 15s polling
# was already catching ~83% of BKK's real GPS fixes (17% of consecutive polls
# saw an unchanged lastUpdateTime - the unavoidable cost of not being phase-
# aligned with BKK's own updates). Polling faster would mostly just add more
# duplicate rows, not more real data; slower would start missing genuine fixes.
bkk.ingestion.poll-interval-ms=15000

# Same area the frontend map queries (see CENTER/RADIUS_METERS in app.js) -
# duplicated here rather than shared, since a static JS file has no way to
# read Spring properties. Deák Ferenc tér, central Budapest.
bkk.ingestion.center-lat=47.4979
bkk.ingestion.center-lon=19.0402
bkk.ingestion.radius-meters=6000
