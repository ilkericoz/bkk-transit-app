spring.application.name=bkk-backend

# Local Postgres connection (the least-privilege app role we created, not the superuser).
# Password is read from the DB_PASSWORD env var, falling back to the local dev value so
# nothing breaks if it's unset — this keeps real credentials out of git even though this
# particular one is just a localhost-only dev password.
spring.datasource.url=jdbc:postgresql://localhost:5432/bkk_transit
spring.datasource.username=bkk_app
spring.datasource.password=${DB_PASSWORD:bkk_dev_pw}

# Lets Hibernate (the JPA implementation Spring Boot pulls in) create/update tables
# from our @Entity classes automatically. Handy for local dev; a real project would
# switch this to "validate" and manage schema changes with Flyway/Liquibase instead
# once the schema stabilizes.
spring.jpa.hibernate.ddl-auto=update

# Logs the actual SQL Hibernate generates — turn this on while learning so you can see
# what your annotations/queries translate to, not just trust it blindly.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Where the (locally downloaded) GTFS static feed's stops.txt lives, relative
# to wherever `mvn spring-boot:run` is launched from (the project root).
bkk.gtfs.stops-file=gtfs-data/raw/stops.txt
