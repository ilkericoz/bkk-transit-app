<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKK Live Transit Map</title>

    <!-- Leaflet from CDN, no SRI hash pinned here on purpose: getting the
         base64 hash wrong silently breaks the whole page (browsers refuse
         to run a resource whose hash doesn't match), which is worse for a
         demo than skipping it. Fine to add later if this ever needs to be
         hardened beyond a portfolio project. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
